# Huawei MateBook 4-way speakers (managed by huawei-4ch; removed by 'huawei-4ch disable').
# Stereo in -> 3 kHz Linkwitz-Riley (24 dB/oct) crossover -> woofers FL/FR, tweeters RL/RR.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "MateBook Speakers"
      media.name       = "MateBook Speakers"
      filter.graph = {
        nodes = [
          { type = builtin label = copy name = inL }
          { type = builtin label = copy name = inR }
          { type = builtin label = bq_lowpass  name = wL1 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_lowpass  name = wL2 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_lowpass  name = wR1 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_lowpass  name = wR2 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_highpass name = tL1 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_highpass name = tL2 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_highpass name = tR1 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_highpass name = tR2 control = { Freq = 3000.0 Q = 0.7071 } }
        ]
        links = [
          { output = "inL:Out" input = "wL1:In" }  { output = "wL1:Out" input = "wL2:In" }
          { output = "inL:Out" input = "tL1:In" }  { output = "tL1:Out" input = "tL2:In" }
          { output = "inR:Out" input = "wR1:In" }  { output = "wR1:Out" input = "wR2:In" }
          { output = "inR:Out" input = "tR1:In" }  { output = "tR1:Out" input = "tR2:In" }
        ]
        inputs  = [ "inL:In" "inR:In" ]
        outputs = [ "wL2:Out" "wR2:Out" "tL2:Out" "tR2:Out" ]
      }
      capture.props = {
        node.name      = "matebook_speakers"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
        priority.session = 2000
      }
      playback.props = {
        node.name       = "matebook_speakers.output"
        audio.channels  = 4
        audio.position  = [ AUX0 AUX1 AUX2 AUX3 ]
        target.object   = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-output-0"
        stream.dont-remix = true
      }
    }
  }
]
