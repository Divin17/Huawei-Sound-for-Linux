# Huawei MateBook 4-way speakers (managed by huawei-4ch; removed by 'huawei-4ch disable').
# Stereo in -> 3 kHz Linkwitz-Riley (24 dB/oct) crossover -> separate limiter per band
# (like Windows' SmartPA: the woofers get their own headroom) -> woofers AUX0/AUX1,
# tweeters AUX2/AUX3. Limiter ceilings follow Windows' measured per-band peaks
# (woofer -0.3 dBFS, tweeter -6.9 dBFS; presets with the EasyEffects limiter at -1 dBFS keep woofer peaks at -1). The tweeter high-pass sits at 2.4 kHz,
# which matches Windows' measured tweeter feed better than 3 kHz.
#
# ZaMaximX2 is a maximizer: it boosts by -Threshold, limits at 0 dBFS, then scales
# the output to "Output Ceiling". Threshold must EQUAL the ceiling, or the band is
# turned down (ceiling < threshold) or driven into the limiter (threshold < ceiling).
#
# pL/pR set the tweeter polarity. With the tweeter amp flat (huawei-speakers
# --tweeter-mode 1, the default in 4-channel mode) woofers and tweeters partly cancel
# around 3 kHz; inverted tweeters (Mult -1) sum 3-7 dB louder at 2.5-3.6 kHz (mic).
# huawei-speakers sets Mult +1 for tweeter mode 2, whose amp filter shifts the phase.
#
# eL*/eR*: acoustic correction (all presets), fitted with the built-in mics against
# Windows' recording through the same mics (tweeter mode 1, inverted tweeters):
# 300 Hz-14 kHz deviation 2.7 -> 1.4 dB RMS. Gains capped at +-4 dB. Set a Gain to 0
# to drop a band, live: pw-cli s matebook_speakers Props '{ params = [ "eL3:Gain" 0 "eR3:Gain" 0 ] }'
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "MateBook Speakers"
      media.name       = "MateBook Speakers"
      filter.graph = {
        nodes = [
          { type = builtin label = copy name = inL }
          { type = builtin label = copy name = inR }
          { type = builtin label = bq_peaking name = eL1 control = { Freq = 445.0 Q = 2.9 Gain = 4.0 } }
          { type = builtin label = bq_peaking name = eL2 control = { Freq = 870.0 Q = 2.2 Gain = -3.25 } }
          { type = builtin label = bq_peaking name = eL3 control = { Freq = 5400.0 Q = 2.9 Gain = -4.0 } }
          { type = builtin label = bq_peaking name = eL4 control = { Freq = 10500.0 Q = 1.6 Gain = 4.0 } }
          { type = builtin label = bq_peaking name = eR1 control = { Freq = 445.0 Q = 2.9 Gain = 4.0 } }
          { type = builtin label = bq_peaking name = eR2 control = { Freq = 870.0 Q = 2.2 Gain = -3.25 } }
          { type = builtin label = bq_peaking name = eR3 control = { Freq = 5400.0 Q = 2.9 Gain = -4.0 } }
          { type = builtin label = bq_peaking name = eR4 control = { Freq = 10500.0 Q = 1.6 Gain = 4.0 } }
          { type = builtin label = bq_lowpass  name = wL1 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_lowpass  name = wL2 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_lowpass  name = wR1 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_lowpass  name = wR2 control = { Freq = 3000.0 Q = 0.7071 } }
          { type = builtin label = bq_highpass name = tL1 control = { Freq = 2400.0 Q = 0.7071 } }
          { type = builtin label = bq_highpass name = tL2 control = { Freq = 2400.0 Q = 0.7071 } }
          { type = builtin label = bq_highpass name = tR1 control = { Freq = 2400.0 Q = 0.7071 } }
          { type = builtin label = bq_highpass name = tR2 control = { Freq = 2400.0 Q = 0.7071 } }
          { type = builtin label = linear name = pL control = { Mult = -1.0 Add = 0.0 } }
          { type = builtin label = linear name = pR control = { Mult = -1.0 Add = 0.0 } }
          { type = ladspa plugin = "/usr/lib/ladspa/ZaMaximX2-ladspa.so" label = ZaMaximX2 name = limW
            control = { "Release" = 60.0 "Output Ceiling" = -0.3 "Threshold" = -0.3 } }
          { type = ladspa plugin = "/usr/lib/ladspa/ZaMaximX2-ladspa.so" label = ZaMaximX2 name = limT
            control = { "Release" = 60.0 "Output Ceiling" = -6.9 "Threshold" = -6.9 } }
        ]
        links = [
          { output = "inL:Out" input = "eL1:In" }  { output = "eL1:Out" input = "eL2:In" }  { output = "eL2:Out" input = "eL3:In" }  { output = "eL3:Out" input = "eL4:In" }
          { output = "inR:Out" input = "eR1:In" }  { output = "eR1:Out" input = "eR2:In" }  { output = "eR2:Out" input = "eR3:In" }  { output = "eR3:Out" input = "eR4:In" }
          { output = "eL4:Out" input = "wL1:In" }  { output = "wL1:Out" input = "wL2:In" }
          { output = "eL4:Out" input = "tL1:In" }  { output = "tL1:Out" input = "tL2:In" }
          { output = "eR4:Out" input = "wR1:In" }  { output = "wR1:Out" input = "wR2:In" }
          { output = "eR4:Out" input = "tR1:In" }  { output = "tR1:Out" input = "tR2:In" }
          { output = "wL2:Out" input = "limW:Audio Input 1" }  { output = "wR2:Out" input = "limW:Audio Input 2" }
          { output = "tL2:Out" input = "pL:In" }  { output = "tR2:Out" input = "pR:In" }
          { output = "pL:Out" input = "limT:Audio Input 1" }  { output = "pR:Out" input = "limT:Audio Input 2" }
        ]
        inputs  = [ "inL:In" "inR:In" ]
        outputs = [ "limW:Audio Output 1" "limW:Audio Output 2" "limT:Audio Output 1" "limT:Audio Output 2" ]
      }
      capture.props = {
        node.name      = "matebook_speakers"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
        priority.session = 2000
      }
      playback.props = {
        node.name       = "matebook_speakers.output"
        audio.channels  = 4
        audio.position  = [ AUX0 AUX1 AUX2 AUX3 ]
        target.object   = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-output-0"
        stream.dont-remix = true
      }
    }
  }
]
