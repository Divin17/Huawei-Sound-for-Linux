# Huawei MateBook 4-channel speakers (managed by huawei-4ch; removed by 'huawei-4ch disable').
# Needs the 4-channel SOF topology. Channels: FL/FR = woofers, RL/RR = tweeters.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" } ]
    actions = { update-props = { audio.channels = 4, audio.position = [ FL, FR, RL, RR ] } }
  }
]
