# Huawei MateBook 4-channel speakers (managed by huawei-4ch; removed by 'huawei-4ch disable').
# The 4-channel SOF topology puts the analog codec link in 4-channel mode, which the
# normal (UCM "HiFi") profile cannot probe, so the card runs in the pro-audio profile.
# pro-output-0 channels: AUX0/AUX1 = woofers, AUX2/AUX3 = tweeters.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-output-0" } ]
    actions = { update-props = { node.description = "MateBook Speakers (4-channel hardware)" priority.session = 100 } }
  }
  { matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-output-3" } ] actions = { update-props = { node.description = "HDMI 1" } } }
  { matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-output-4" } ] actions = { update-props = { node.description = "HDMI 2" } } }
  { matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-output-5" } ] actions = { update-props = { node.description = "HDMI 3" } } }
  { matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-output-31" } ] actions = { update-props = { node.disabled = true } } }
  { matches = [ { node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-input-0" } ] actions = { update-props = { node.disabled = true } } }
  { matches = [ { node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-input-7" } ] actions = { update-props = { node.disabled = true } } }
  {
    matches = [ { node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.pro-input-6" } ]
    actions = { update-props = { node.description = "Built-in Microphone" priority.session = 2000 } }
  }
]
